<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout concept: a hydrometric survey sheet. A sticky header with a tab strip, then one wide column of working panels,
   each headed by a graduated gauge rule. Water, instruments and proof tags carry the identity. */
:root{
  --bg:#edf3f4; --surface:#fbfdfd; --surface2:#e2ebed; --ink:#10282f; --ink2:#44606a; --line:#c4d3d7;
  --accent:#0a6b8c; --accent-ink:#ffffff; --accent-soft:#d2e8ef; --water:#2f93b8;
  --good:#1b7f55; --warn:#b36a00; --crit:#b53a2c;
  --f-display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08171c; --surface:#0e2128; --surface2:#16303a; --ink:#dcebef; --ink2:#8fb0ba; --line:#254753;
  --accent:#4cc0e3; --accent-ink:#06222b; --accent-soft:#12404f; --water:#3aa6cc;
  --good:#4cc790; --warn:#e5a53a; --crit:#f0786a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08171c; --surface:#0e2128; --surface2:#16303a; --ink:#dcebef; --ink2:#8fb0ba; --line:#254753;
  --accent:#4cc0e3; --accent-ink:#06222b; --accent-soft:#12404f; --water:#3aa6cc;
  --good:#4cc790; --warn:#e5a53a; --crit:#f0786a; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--f-display);font-stretch:108%;font-weight:750;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:.005em}
h2{font-size:1.5rem}h3{font-size:1.08rem}h4{font-size:.95rem}
p{margin:0 0 .7em;max-width:68ch}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.muted{color:var(--ink2)}
.small{font-size:.84rem}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line);padding-top:10px}
.brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-stretch:118%;font-weight:850;font-size:1.35rem;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand small{display:block;font-family:var(--f-mono);font-stretch:100%;font-weight:400;font-size:.68rem;letter-spacing:.08em;color:var(--ink2);margin-top:5px;text-transform:none}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{background:transparent;border:0;padding:5px 12px;font-family:var(--f-mono);font-size:.78rem;cursor:pointer;color:var(--ink2)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:thin}
.tab{flex:0 0 auto;background:transparent;border:0;border-bottom:3px solid transparent;padding:8px 12px 7px;cursor:pointer;color:var(--ink2);font-family:var(--f-display);font-stretch:100%;font-weight:600;font-size:.9rem;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:750}
/* gauge rule */
.rule{height:9px;width:132px;margin:8px 0 14px;background:
  repeating-linear-gradient(90deg,var(--ink2) 0 1px,transparent 1px 6px) bottom/100% 5px no-repeat,
  repeating-linear-gradient(90deg,var(--ink) 0 1.5px,transparent 1.5px 30px) bottom/100% 9px no-repeat;opacity:.6}

.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.ph{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lead{font-size:1.04rem;color:var(--ink2);max-width:74ch}
.hero{padding:6px 0 4px}

.hero p{font-size:1.08rem;color:var(--ink2);margin-top:12px}
/* generic blocks */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}

.pill.good{border-color:var(--good);color:var(--good)}.pill.warn{border-color:var(--warn);color:var(--warn)}.pill.crit{border-color:var(--crit);color:var(--crit)}.pill.acc{border-color:var(--accent);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
/* controls */
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:.88rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn.on{background:var(--crit);border-color:var(--crit);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;cursor:pointer;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
select,input[type=number],input[type=text],textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
input[type=range]{accent-color:var(--accent);width:100%}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.84rem;min-width:0}
label.f .lt{display:flex;justify-content:space-between;gap:8px;align-items:baseline}

.chk{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;cursor:pointer}
.chk input{margin-top:4px;accent-color:var(--accent)}
details{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
summary{cursor:pointer;padding:10px 14px;font-weight:600}
details .in{padding:4px 14px 14px}
/* simulator */
.tanks{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,200px) minmax(0,1fr);gap:12px;align-items:stretch}
@media (max-width:820px){.tanks{grid-template-columns:minmax(0,1fr)}}
.dam{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.dam header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.dam svg{width:100%;height:auto;max-height:310px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.86rem;margin:0}
.kv dt{color:var(--ink2)}.kv dd{margin:0;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pumps{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.pump{border:1px solid var(--line);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:6px;font-size:.86rem}
.pump.run{border-color:var(--accent);background:var(--accent-soft)}
.arrow{font-family:var(--f-display);font-weight:800;font-size:1.05rem}
.ctrl3{display:grid;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.log{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:.84rem}
.log div{display:grid;grid-template-columns:62px 92px 1fr;gap:8px;padding:5px 10px;border-bottom:1px solid var(--line)}
.log div:last-child{border-bottom:0}
.log .k{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.log .k.alert{color:var(--crit)}.log .k.guard{color:var(--warn)}.log .k.decision{color:var(--accent)}.log .k.cal{color:var(--good)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-mono);font-size:10px;fill:var(--ink2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--ink2)}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.bignum{font-family:var(--f-display);font-stretch:110%;font-weight:800;font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1}
.stat{display:flex;flex-direction:column;gap:3px}
.stat .l{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.meter{height:12px;border-radius:6px;background:var(--surface2);position:relative;overflow:hidden;border:1px solid var(--line)}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
/* stack / flow */
.stack{display:grid;grid-template-columns:minmax(160px,230px) minmax(0,1fr);gap:14px}
@media (max-width:700px){.stack{grid-template-columns:minmax(0,1fr)}}
.layers{display:flex;flex-direction:column;gap:6px}
.layer{display:flex;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.layer[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.layer b{font-family:var(--f-display);font-size:.95rem}
.layer span.t{font-family:var(--f-mono);font-size:.7rem;color:var(--ink2);margin-left:auto}
/* persona */
.persona{display:flex;gap:6px;flex-wrap:wrap}
.road-ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prog{flex:1 1 120px;max-width:260px}
.task{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
.task:last-child{border-bottom:0}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;min-width:0}
.msgs{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto;padding:2px}
.msg{padding:9px 12px;border-radius:8px;white-space:pre-wrap;word-wrap:break-word;font-size:.92rem;border:1px solid var(--line);background:var(--surface)}
.msg.u{background:var(--accent-soft);border-color:var(--accent-soft);align-self:flex-end;max-width:92%}
.msg.a{align-self:flex-start;max-width:100%}
.msg.e{border-color:var(--crit);color:var(--crit)}
.chat textarea{width:100%;min-height:64px;resize:vertical}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:.8rem;cursor:pointer;text-align:left}
.sugg button:hover{border-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:.85rem;z-index:20;max-width:90vw}
.ul{margin:0;padding-left:1.15em}.ul li{margin:.2em 0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.hr{border:0;border-top:1px solid var(--line);margin:4px 0}

.svgt{fill:var(--ink);font-family:var(--f-body);font-size:12px}
.svgt2{fill:var(--ink2);font-family:var(--f-mono);font-size:10px}
.svgh{fill:var(--ink);font-family:var(--f-display);font-weight:700;font-size:13px}
.s-box{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.s-acc{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.2}
.s-line{stroke:var(--ink2);stroke-width:1.4;fill:none}
.s-accl{stroke:var(--accent);stroke-width:1.8;fill:none}
.s-warnl{stroke:var(--warn);stroke-width:1.4;fill:none;stroke-dasharray:4 3}
.s-critl{stroke:var(--crit);stroke-width:1.4;fill:none;stroke-dasharray:5 3}
.s-glass{fill:var(--surface);stroke:var(--ink2);stroke-width:1.6}

.s-band{fill:var(--ink);opacity:.14}
.s-est{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 3;fill:none}
.s-tick{stroke:var(--ink2);stroke-width:1}

.s-fill-good{fill:var(--good)}
.s-fill-acc{fill:var(--accent)}
.s-fill-warn{fill:var(--warn)}
.s-truth{stroke:var(--ink);stroke-width:2.2;fill:none}
.s-estl{stroke:var(--accent);stroke-width:1.8;fill:none}
.s-lbl{fill:var(--ink2);font-family:var(--f-mono);font-size:8.5px}
.s-gbar{fill:var(--surface2);stroke:var(--line)}
.s-warnfill{fill:var(--warn)}
.s-critfill{fill:var(--crit)}
.s-goodfill{fill:var(--good)}
.s-bandpoly{fill:var(--accent);opacity:.18;stroke:none}
.s-floor{stroke:var(--good);stroke-width:1.2;stroke-dasharray:2 3;fill:none}
pre.code{margin:0;padding:10px 12px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;overflow:auto;font-family:var(--f-mono);font-size:.76rem;line-height:1.45;max-height:300px}
.formula{font-family:var(--f-mono);font-size:.84rem;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;overflow-x:auto;white-space:pre}
.presets{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.presets .btn{text-align:left}
.sliders{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}

a,.ul li,td,.card p{overflow-wrap:anywhere}
.prog{display:block}.prog .meter{display:block}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.msg pre.code{margin:6px 0}

</style>

<script>

/* ---- engine.js ---- */
/* ===================== ENGINE (pure logic, no DOM) ===================== */
const CM2 = 1650, LPC = CM2 / 1000; // surface 1 650 cm2 -> 1,65 L per cm
const DAMDIM = { A: { L: 30, W: 55, H: 30 }, B: { L: 30, W: 55, H: 25 } };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gauss(r) { let u = 0, v = 0; while (u === 0) u = r(); while (v === 0) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

function damGeom(id, intakeCm) {
  const d = DAMDIM[id];
  return { id, H: d.H, fullL: d.H * LPC, usableH: d.H * 0.9, usableL: d.H * 0.9 * LPC, intakeL: intakeCm * LPC };
}

/* Scenarios: simulated inflow (L/min) and fictitious forecast spread (P10/P90 as multipliers of P50) */
const SCEN = {
  normal:  { in: { A: 0.35, B: 0.25 }, p10: 0.6, p90: 1.5 },
  rain:    { in: { A: 1.40, B: 0.50 }, p10: 0.3, p90: 2.0 },
  drought: { in: { A: 0.04, B: 0.03 }, p10: 0.0, p90: 1.0 }
};
const ALLOC = {
  normal:  { potable: 1, agri: 1,  indus: 1 },
  pre:     { potable: 1, agri: .7, indus: .8 },
  alert:   { potable: 1, agri: .3, indus: .5 },
  urgence: { potable: 1, agri: 0,  indus: 0 }
};
const GATES = ['potable', 'agri', 'indus'];
const DEFAULT_P = {
  initA: 34, initB: 26,        // L (demo start)
  qPump: 3.0,                  // L/min [A mesurer]
  qGate100: 0.6,               // L/min per gate at 100 % [A mesurer]
  demand: { potable: 0.15, agri: 0.30, indus: 0.15 }, // L/min (demo)
  floorPct: 25,                // % of usable volume
  horizon: 30,                 // min
  tmax: 90,                    // min  [A fixer]
  sigmaMax: 2.5,               // L    [A fixer]
  watchdog: 3,                 // ticks [A fixer]
  maxRun: 12,                  // min max pump run
  reliefPct: 85,               // % usable
  potableMinOpen: 15,          // %
  evap: 0.01,                  // L/min
  sigma0: 0.4,                 // L (reading error of graduated scale)
  driftRate: 0.01,             // L/min

ACT['tw-run'] = () => { if (TW.run) twPause(); else twStart(); };

ACT['tw-scen'] = el => { TW.s.scenario = el.getAttribute('data-v'); twDraw(); };
ACT['tw-cal'] = el => {
  const s = TW.s; if (!s.power) { toast(x(['Alimentation coupée : lecture impossible à enregistrer.', 'Power off: reading cannot be recorded.'])); return; }
  const id = el.getAttribute('data-v'), dl = recalibrate(s, id, false);
  toast(x(['Recalage ' + id + ' : correction ' + (dl >= 0 ? '+' : '') + num(dl, 1) + ' L', 'Calibration ' + id + ': correction ' + (dl >= 0 ? '+' : '') + num(dl, 1) + ' L'])); twDraw();
};
ACT['tw-calboth'] = () => { const s = TW.s; if (!s.power) { toast(x(['Alimentation coupée : lecture impossible à enregistrer.', 'Power off: reading cannot be recorded.'])); return; } recalibrate(s, 'A', false); recalibrate(s, 'B', false); twDraw(); };
ACT['tw-pump'] = el => {
  const dir = el.getAttribute('data-v'), m = Math.max(0.5, +$('#tw-min').value || 4), r = startPump(TW.s, dir, m, 'manual');
  if (!r.ok) toast(x(['Refusé : ', 'Refused: ']) + rs(r.reason)); twDraw();
};
ACT['tw-pstop'] = () => { stopPump(TW.s, 'manual'); twDraw(); };
ACT['tw-preset'] = el => { twPause(); twNew(el.getAttribute('data-v')); twDraw(); twStart(); };
ACT['tw-copy'] = () => copyText(JSON.stringify(snapshot(TW.s), null, 1), x(['État copié', 'State copied']));
ACT['tw-defaults'] = () => { PARAMS.forEach(p => { TW.s.P[p[0]] = DEFAULT_P[p[0]]; const el = $('[data-p="' + p[0] + '"]'); if (el) el.value = DEFAULT_P[p[0]]; const o = $('#tw-po-' + p[0]); if (o) o.textContent = DEFAULT_P[p[0]]; }); twDraw(); };
CHG.twin = e => {
  const s = TW.s, t = e.target; if (!s || !t.id) return;
  if (t.id === 'tw-link') { s.link = t.checked; logEv(s, 'info', 'inject', { what: 'link', v: t.checked }); }
  else if (t.id === 'tw-power') { s.power = t.checked; logEv(s, 'info', 'inject', { what: 'power', v: t.checked }); }
  else if (t.id === 'tw-auto') s.autoCal = t.checked;
  else if (t.id === 'tw-reveal') TW.reveal = t.checked;
  else return;
  twDraw();
};
INP.twin = e => {
  const t = e.target, k = t.getAttribute && t.getAttribute('data-tw'); if (!k || !TW.s) return;
  if (k === 'gate') {
    const ok = setGateTarget(TW.s, t.getAttribute('data-dam'), t.getAttribute('data-gate'), +t.value);
    if (!ok) { toast(x(['Commande impossible : liaison ou alimentation absente.', 'Command impossible: link or power missing.'])); }
    twDraw();
  } else if (k === 'param') {
    const p = t.getAttribute('data-p'); TW.s.P[p] = +t.value; const o = $('#tw-po-' + p); if (o) o.textContent = t.value; twDraw();
  }
};

  [0, 6, 12, 18, 24].forEach(hh => { o += '<text x="' + xv(day0 + hh * 60) + '" y="' + (H - 8) + '" text-anchor="' + (hh === 24 ? 'end' : hh === 0 ? 'start' : 'middle') + '">' + hh + ' h</text>'; });

function mtCompute() {
  const S = SIGNALS[MT.sig];
  const vals = genSeries({ sig: MT.sig, n: MT.n, seed: MT.seed, fault: MT.fault, start: MT.start, sev: MT.sev });
  const ch = ewmaChart(vals, MT.lam, MT.L, MT.nBase);
  const lim = S.mu + S.dir * MT.limK * S.sigma;
  let fa = 0; for (let i = MT.nBase; i < Math.min(MT.start, MT.n); i++) { const p = ch.pts[i]; if (p.z > p.ucl || p.z < p.lcl) fa++; }
  let cross = -1; for (let i = 0; i < ch.pts.length; i++) { const z = ch.pts[i].z; if ((S.dir > 0 && z >= lim) || (S.dir < 0 && z <= lim)) { cross = i; break; } }
  const rul = ch.alarm >= 0 ? predictRUL(ch, ch.alarm, lim, 12) : null;
  return { S, vals, ch, lim, fa, cross, rul };
}
